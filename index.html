<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden;
  }
  #gameContainer {
    position: relative; border: 2px solid #334; border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,100,255,0.15);
  }
  canvas { display: block; background: #0a0a1a; border-radius: 6px; }
  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 15px 20px; display: flex; justify-content: space-between;
    pointer-events: none; user-select: none;
  }
  #ui span { color: #8af; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px rgba(100,170,255,0.5); }
  #score { color: #fff; font-size: 22px; }
  #highScore { color: #ff8; font-size: 13px; position: absolute; bottom: 12px; left: 15px; pointer-events: none; opacity: 0.6; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(5,5,20,0.82); pointer-events: auto; border-radius: 6px; transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { color: #fff; font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 30px rgba(100,170,255,0.6); }
  #overlay .sub { color: #8af; font-size: 16px; margin-bottom: 6px; }
  #overlay .final-score { color: #ff8; font-size: 22px; margin-bottom: 5px; }
  #overlay .best-score { color: #8af; font-size: 16px; margin-bottom: 25px; opacity: 0.8; }
  #overlay .controls { color: #667; font-size: 13px; margin-top: 20px; line-height: 1.6; }
  #overlay .legend { color: #556; font-size: 12px; margin-top: 10px; }
  .legend span { padding: 0 6px; }
  button {
    background: linear-gradient(135deg, #226, #448); color: #fff;
    border: 1px solid #66a; padding: 12px 40px; font-size: 18px;
    font-family: 'Courier New', monospace; border-radius: 6px; cursor: pointer;
    transition: all 0.2s; pointer-events: auto; margin-top: 10px;
  }
  button:hover { background: linear-gradient(135deg, #338, #66a); border-color: #88c; box-shadow: 0 0 20px rgba(100,170,255,0.3); }
  .lives { color: #f55 !important; text-shadow: 0 0 10px rgba(255,80,80,0.5); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <span id="scoreDisplay">0</span>
    <span id="livesDisplay" class="lives">&#9829; &#9829; &#9829;</span>
  </div>
  <div id="highScore"></div>
  <div id="overlay">
    <h1>&#9733; COSMIC DODGE &#9733;</h1>
    <div class="sub">Navigate the asteroid field</div>
    <div class="best-score" id="hiDisplay"></div>
    <button id="startBtn">&#9654; PLAY</button>
    <div class="controls">Move: WASD / Arrows &bull; Shoot: Space / F</div>
    <div class="legend">
      <span style="color:#f44">&#9829; Extra Life</span>
      <span style="color:#ff0">&#9889; Rapid Fire</span>
      <span style="color:#4af">&#9724; Shield</span>
      <span style="color:#f84">&#9884; Spread</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const highScoreEl = document.getElementById('highScore');
const hiDisplay = document.getElementById('hiDisplay');
const startBtn = document.getElementById('startBtn');

const W = 600, H = 800;
canvas.width = W; canvas.height = H;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

let game = null, keys = {}, gameOverDisplayed = false;

// ── Audio ──────────────────────────────────────────────
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function play(type) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    // If context is suspended, resume on next user gesture instead
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(()=>{});
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    switch (type) {
      case 'shoot':
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
        gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.start(t); osc.stop(t + 0.08);
        break;
      case 'explode':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
        gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
        break;
      case 'hit':
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, t);
        osc.frequency.exponentialRampToValueAtTime(20, t + 0.2);
        gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
        break;
      case 'powerup':
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.15);
        gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
        break;
      case 'gameover':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.8);
        gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.start(t); osc.stop(t + 0.8);
        break;
    }
  } catch(e) {}
}

// ── Stars ──────────────────────────────────────────────
const starLayers = [
  Array.from({length: 60}, () => ({ x: Math.random()*W, y: Math.random()*H, s: Math.random()+0.5, b: Math.random(), sp: 0.1 })),
  Array.from({length: 40}, () => ({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.5+1, b: Math.random(), sp: 0.3 })),
  Array.from({length: 20}, () => ({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+1.5, b: Math.random(), sp: 0.6 }))
];
function drawStars(dy) {
  starLayers.forEach((layer, li) => {
    layer.forEach(s => {
      s.b += (Math.random()-0.5)*0.04; s.b = Math.max(0.3, Math.min(1, s.b));
      let y = s.y - dy * s.sp * (li+1);
      if (y < -5) y += H + 10; if (y > H + 5) y -= H + 10;
      s.y = y;
      ctx.fillStyle = `rgba(255,255,255,${s.b*(0.4+li*0.2)})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    });
  });
}

// ── Particle System ──────────────────────────────────
class Particle {
  constructor(x, y, color, vx, vy, life, size, shrink) {
    this.x=x; this.y=y; this.color=color; this.vx=vx; this.vy=vy;
    this.life=life; this.maxLife=life; this.size=size||3; this.shrink=shrink!==false;
  }
  update() { this.x+=this.vx; this.y+=this.vy; this.life--; }
  draw(c) {
    const a=this.life/this.maxLife;
    c.globalAlpha=a; c.fillStyle=this.color;
    const s = this.shrink ? this.size*a : this.size;
    c.fillRect(this.x-s/2, this.y-s/2, s, s); c.globalAlpha=1;
  }
  get dead() { return this.life<=0; }
}

// ── Text Popup ────────────────────────────────────────
class TextPopup {
  constructor(x, y, text, color, life) {
    this.x=x; this.y=y; this.text=text; this.color=color;
    this.life=life||40; this.maxLife=life||40;
  }
  update() { this.y -= 1.5; this.life--; }
  draw(c) {
    c.globalAlpha=this.life/this.maxLife;
    c.fillStyle=this.color; c.font='bold 16px monospace'; c.textAlign='center';
    c.fillText(this.text, this.x, this.y); c.globalAlpha=1;
  }
  get dead() { return this.life<=0; }
}

// ── Ship ──────────────────────────────────────────────
class Ship {
  constructor() {
    this.x=W/2; this.y=H-80; this.w=28; this.h=32;
    this.speed=5; this.invincible=0; this.tilt=0;
    this.engineTimer=0;
  }
  update() {
    let dx=0, dy=0;
    if (keys['ArrowLeft']||keys['KeyA']) dx=-1;
    if (keys['ArrowRight']||keys['KeyD']) dx=1;
    if (keys['ArrowUp']||keys['KeyW']) dy=-1;
    if (keys['ArrowDown']||keys['KeyS']) dy=1;
    if (dx&&dy) { dx*=0.707; dy*=0.707; }
    this.x+=dx*this.speed; this.y+=dy*this.speed;
    this.x=Math.max(this.w, Math.min(W-this.w, this.x));
    this.y=Math.max(this.h, Math.min(H-this.h, this.y));
    this.tilt+=(dx*0.15-this.tilt)*0.15;
    if (this.invincible>0) this.invincible--;
    // Engine trail
    this.engineTimer--;
    if (this.engineTimer<=0) {
      this.engineTimer=3;
      const vx = (Math.random()-0.5)*0.5, vy = Math.random()*1.5+1;
      if (game) game.particles.push(new Particle(this.x+vx*4, this.y+18, `hsl(${190+Math.random()*30},80%,${50+Math.random()*30}%)`, vx, vy, 20, Math.random()*5+3, true));
    }
  }
  draw(c) {
    if (this.invincible>0&&Math.floor(this.invincible/4)%2===0) return;
    c.save(); c.translate(this.x, this.y); c.rotate(this.tilt);
    // Shield glow
    if (game && game.shieldTimer>0) {
      c.strokeStyle=`rgba(68,170,255,${0.2+0.3*Math.sin(Date.now()/100)})`;
      c.lineWidth=3; c.beginPath(); c.arc(0, 0, 24, 0, Math.PI*2); c.stroke();
    }
    // Engine
    const grad=c.createRadialGradient(0,18,2,0,22,18);
    grad.addColorStop(0,'rgba(100,200,255,0.8)'); grad.addColorStop(1,'rgba(100,200,255,0)');
    c.fillStyle=grad; c.beginPath(); c.arc(0,20,18,0,Math.PI*2); c.fill();
    // Body
    c.fillStyle='#6af'; c.beginPath();
    c.moveTo(0,-18); c.lineTo(-14,14); c.lineTo(-6,10);
    c.lineTo(-4,16); c.lineTo(0,20); c.lineTo(4,16);
    c.lineTo(6,10); c.lineTo(14,14); c.closePath(); c.fill();
    c.strokeStyle='#8cf'; c.lineWidth=1.5; c.stroke();
    c.restore();
  }
  getBounds() { return {x:this.x-8, y:this.y-14, w:16, h:30}; }
}

// ── Bullet ────────────────────────────────────────────
class Bullet {
  constructor(x, y, angle) {
    this.x=x; this.y=y; this.w=4; this.h=12;
    if (angle) {
      this.vx=Math.sin(angle)*3; this.vy=-Math.cos(angle)*10;
    } else { this.vx=0; this.vy=-10; }
  }
  update() { this.x+=this.vx; this.y+=this.vy; }
  draw(c) {
    const grad=c.createLinearGradient(this.x,this.y-6,this.x,this.y+6);
    grad.addColorStop(0,'rgba(255,255,200,0)');
    grad.addColorStop(0.3,'#ff8'); grad.addColorStop(0.7,'#ff8');
    grad.addColorStop(1,'rgba(255,255,200,0)');
    c.fillStyle=grad; c.fillRect(this.x-2,this.y-6,4,12);
  }
  get dead() { return this.y<-10||this.y>H+10||this.x<-10||this.x>W+10; }
  getBounds() { return {x:this.x-2, y:this.y-6, w:4, h:12}; }
}

// ── Asteroid ──────────────────────────────────────────
class Asteroid {
  constructor(x, y, radius, vx, vy) {
    if (x!==undefined) {
      this.x=x; this.y=y; this.radius=radius;
      this.vx=vx; this.vy=vy;
    } else {
      this.radius=Math.random()*18+14;
      const side=Math.floor(Math.random()*4);
      switch(side) {
        case 0: this.x=Math.random()*W; this.y=-this.radius; break;
        case 1: this.x=W+this.radius; this.y=Math.random()*H*0.6; break;
        case 2: this.x=Math.random()*W; this.y=H+this.radius; break;
        case 3: this.x=-this.radius; this.y=Math.random()*H*0.6; break;
      }
      const angle=Math.atan2(H/2-this.y, W/2-this.x)+(Math.random()-0.5)*1.2;
      const speed=Math.random()*1.5+0.8+(game?game.level*0.15:0);
      this.vx=Math.cos(angle)*speed; this.vy=Math.sin(angle)*speed;
    }
    this.rotation=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.04;
    const vertCount=Math.floor(Math.random()*5)+6;
    this.vertices=[];
    for (let i=0; i<vertCount; i++) {
      const a=i/vertCount*Math.PI*2;
      this.vertices.push({a, r:this.radius*(0.7+Math.random()*0.3)});
    }
    this.color=Math.random()>0.5?'#876':'#765';
  }
  update() {
    this.x+=this.vx; this.y+=this.vy; this.rotation+=this.rotSpeed;
    const m=this.radius+50;
    if (this.x<-m||this.x>W+m||this.y<-m||this.y>H+m) this.dead=true;
  }
  draw(c) {
    c.save(); c.translate(this.x,this.y); c.rotate(this.rotation);
    c.fillStyle=this.color; c.strokeStyle='#a98'; c.lineWidth=1.5;
    c.beginPath();
    this.vertices.forEach((v,i)=>{
      const x=Math.cos(v.a)*v.r, y=Math.sin(v.a)*v.r;
      i===0?c.moveTo(x,y):c.lineTo(x,y);
    });
    c.closePath(); c.fill(); c.stroke();
    // Inner detail line
    c.strokeStyle='rgba(170,153,136,0.3)'; c.lineWidth=0.5;
    c.beginPath(); c.moveTo(-this.radius*0.4, -this.radius*0.2);
    c.lineTo(this.radius*0.3, this.radius*0.3); c.stroke();
    c.restore();
  }
  getBounds() { return {x:this.x-this.radius, y:this.y-this.radius, w:this.radius*2, h:this.radius*2}; }
  getRadius() { return this.radius; }
}

// ── PowerUp ────────────────────────────────────────────
const PU_TYPES = [
  { id:'health', symbol:'&#9829;', color:'#f44', label:'+1 Life' },
  { id:'rapid',  symbol:'&#9889;', color:'#ff0', label:'Rapid Fire' },
  { id:'shield', symbol:'&#9724;', color:'#4af', label:'Shield' },
  { id:'spread', symbol:'&#9884;', color:'#f84', label:'Spread Shot' }
];
class PowerUp {
  constructor(x, y) {
    this.x=x; this.y=y; this.radius=12;
    this.vy=1; this.type=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
    this.life=600; // 10s to pick up
  }
  update() { this.y+=this.vy; this.life--; }
  draw(c) {
    if (this.life<120&&Math.floor(this.life/6)%2===0) return; // blink before expiring
    const pulse=1+0.15*Math.sin(Date.now()/200);
    c.save(); c.translate(this.x,this.y); c.scale(pulse,pulse);
    // Glow
    const g=c.createRadialGradient(0,0,2,0,0,this.radius+4);
    g.addColorStop(0,this.type.color+66); g.addColorStop(1,this.type.color+'00');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,this.radius+4,0,Math.PI*2); c.fill();
    // Circle
    c.strokeStyle=this.type.color; c.lineWidth=2;
    c.beginPath(); c.arc(0,0,this.radius,0,Math.PI*2); c.stroke();
    // Symbol
    c.fillStyle='#fff'; c.font='bold 14px monospace'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(this.type.symbol,0,1);
    c.restore();
  }
  getBounds() { return {x:this.x-this.radius, y:this.y-this.radius, w:this.radius*2, h:this.radius*2}; }
  get dead() { return this.life<=0||this.y>H+20; }
}

// ── Collision ──────────────────────────────────────────
function rcol(a,b) { return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

// ── Explosion Helper ──────────────────────────────────
function explosion(particles, x, y, color, count, spread, life) {
  for (let i=0; i<count; i++) {
    const a=Math.random()*Math.PI*2, sp=Math.random()*spread+1;
    particles.push(new Particle(x,y,color,Math.cos(a)*sp,Math.sin(a)*sp,Math.floor(Math.random()*life)+life/2,Math.random()*4+2,true));
  }
}

// ── High Score ────────────────────────────────────────
function getHigh() { return parseInt(localStorage.getItem('cosmicDodgeHi')||'0'); }
function setHigh(s) {
  const old=getHigh();
  if (s>old) { localStorage.setItem('cosmicDodgeHi',s); return true; }
  return false;
}
function showHigh() {
  const h=getHigh();
  highScoreEl.textContent=h>0?'HI: '+h:'';
  hiDisplay.textContent=h>0?'Best: '+h:'';
}

// ── Screen Shake ──────────────────────────────────────
let shakeX=0, shakeY=0, shakeMag=0;
function shake(mag) { shakeMag=Math.max(shakeMag,mag); }

// ── Game ──────────────────────────────────────────────
class Game {
  constructor() {
    this.ship=new Ship();
    this.bullets=[]; this.asteroids=[]; this.particles=[]; this.powerups=[]; this.textPopups=[];
    this.score=0; this.lives=3; this.level=1; this.dead=false;
    this.spawnTimer=0; this.spawnInterval=50;
    this.shootCooldown=0;
    this.combo=0; this.maxCombo=0;
    this.rapidTimer=0; this.shieldTimer=0; this.spreadTimer=0;
    this.starDy=0;
  }
  update() {
    this.starDy+=0.5+this.level*0.05;
    this.ship.update();
    this.shootCooldown--;

    // Timers
    if (this.rapidTimer>0) this.rapidTimer--;
    if (this.shieldTimer>0) this.shieldTimer--;
    if (this.spreadTimer>0) this.spreadTimer--;

    // Shoot
    const cooldown=this.rapidTimer>0?4:10;
    if ((keys['Space']||keys['KeyF'])&&this.shootCooldown<=0) {
      play('shoot');
      this.shootCooldown=cooldown;
      if (this.spreadTimer>0) {
        this.bullets.push(new Bullet(this.ship.x, this.ship.y-18, -0.2));
        this.bullets.push(new Bullet(this.ship.x, this.ship.y-18, 0));
        this.bullets.push(new Bullet(this.ship.x, this.ship.y-18, 0.2));
      } else {
        this.bullets.push(new Bullet(this.ship.x, this.ship.y-18));
      }
    }

    this.bullets.forEach(b=>b.update());
    this.bullets=this.bullets.filter(b=>!b.dead);

    // Spawn asteroids
    this.spawnTimer++;
    const interval=Math.max(15, this.spawnInterval-this.level*2);
    if (this.spawnTimer>=interval&&this.asteroids.length<12+this.level) {
      this.asteroids.push(new Asteroid());
      this.spawnTimer=0;
    }

    this.asteroids.forEach(a=>a.update());
    this.asteroids=this.asteroids.filter(a=>!a.dead);

    this.particles.forEach(p=>p.update());
    this.particles=this.particles.filter(p=>!p.dead);

    this.powerups.forEach(p=>p.update());
    this.powerups=this.powerups.filter(p=>!p.dead);

    this.textPopups.forEach(t=>t.update());
    this.textPopups=this.textPopups.filter(t=>!t.dead);

    // Screen shake decay
    if (shakeMag>0) { shakeMag*=0.85; if (shakeMag<0.3) shakeMag=0; }
    if (shakeMag>0) {
      shakeX=(Math.random()-0.5)*shakeMag*2;
      shakeY=(Math.random()-0.5)*shakeMag*2;
    } else { shakeX=0; shakeY=0; }

    // Bullet-asteroid collisions
    for (let i=this.bullets.length-1; i>=0; i--) {
      for (let j=this.asteroids.length-1; j>=0; j--) {
        const ast=this.asteroids[j];
        if (rcol(this.bullets[i].getBounds(), ast.getBounds())) {
          const bx=ast.x, by=ast.y, br=ast.radius;
          play('explode');
          explosion(this.particles, bx, by, '#f84', 15, 4, 25);
          explosion(this.particles, bx, by, '#ff8', 8, 2.5, 20);
          explosion(this.particles, bx, by, '#f44', 5, 5, 15);

          this.bullets.splice(i,1);
          this.asteroids.splice(j,1);

          this.combo++;
          if (this.combo>this.maxCombo) this.maxCombo=this.combo;
          const bonus=Math.ceil(br/4)*(1+this.combo*0.1);
          this.score+=Math.floor(bonus);

          this.textPopups.push(new TextPopup(bx,by,'+'+Math.floor(bonus),'#ff8',30));

          // Split asteroids
          if (br>10) {
            const newR=br*0.55;
            for (let s=0; s<2; s++) {
              const a=Math.random()*Math.PI*2, sp=Math.random()*2+1.5;
              const child=new Asteroid(bx,by,newR,Math.cos(a)*sp,Math.sin(a)*sp);
              this.asteroids.push(child);
            }
          }

          // Possibly drop powerup (12% chance)
          if (Math.random()<0.12) {
            this.powerups.push(new PowerUp(bx, by));
          }

          // Small debris particles
          for (let d=0; d<6; d++) {
            this.particles.push(new Particle(bx,by,'#a98',(Math.random()-0.5)*2,(Math.random()-0.5)*2,15,2,true));
          }
          break;
        }
      }
    }

    // Bullet-powerup collisions (auto-collect)
    for (let i=this.bullets.length-1; i>=0; i--) {
      for (let j=this.powerups.length-1; j>=0; j--) {
        if (rcol(this.bullets[i].getBounds(), this.powerups[j].getBounds())) {
          this.collectPowerUp(this.powerups[j]);
          this.powerups.splice(j,1);
          this.bullets.splice(i,1);
          break;
        }
      }
    }

    // Ship-powerup collisions
    if (this.ship.invincible<=0) {
      const sb=this.ship.getBounds();
      for (let j=this.powerups.length-1; j>=0; j--) {
        if (rcol(sb, this.powerups[j].getBounds())) {
          this.collectPowerUp(this.powerups[j]);
          this.powerups.splice(j,1);
        }
      }
    }

    // Ship-asteroid collisions
    if (this.ship.invincible<=0) {
      const sb=this.ship.getBounds();
      for (const a of this.asteroids) {
        if (rcol(sb, a.getBounds())) {
          if (this.shieldTimer>0) {
            // Shield absorbs hit
            this.shieldTimer=0;
            this.ship.invincible=30;
            play('powerup');
            explosion(this.particles, this.ship.x, this.ship.y, '#4af', 20, 4, 20);
            this.textPopups.push(new TextPopup(this.ship.x,this.ship.y-20,'SHIELD!','#4af',30));
          } else {
            this.lives--;
            this.combo=0;
            this.ship.invincible=60;
            play('hit');
            shake(8);
            explosion(this.particles, this.ship.x, this.ship.y, '#6af', 15, 3, 20);
            if (this.lives<=0) {
              this.dead=true;
              play('gameover');
            }
          }
          break;
        }
      }
    }

    // Level progression
    const newLevel=Math.floor(this.score/30)+1;
    if (newLevel>this.level) {
      this.level=newLevel;
      this.textPopups.push(new TextPopup(W/2,H/2,'LEVEL '+this.level,'#4af',50));
      explosion(this.particles, W/2, H/2, '#4af', 30, 5, 30);
    }
  }

  collectPowerUp(pu) {
    play('powerup');
    switch (pu.type.id) {
      case 'health':
        this.lives=Math.min(5, this.lives+1);
        this.textPopups.push(new TextPopup(pu.x,pu.y-15,'+1 LIFE','#f44',30));
        break;
      case 'rapid':
        this.rapidTimer=480; // 8s
        this.textPopups.push(new TextPopup(pu.x,pu.y-15,'RAPID FIRE','#ff0',30));
        break;
      case 'shield':
        this.shieldTimer=480; // 8s
        this.textPopups.push(new TextPopup(pu.x,pu.y-15,'SHIELD','#4af',30));
        break;
      case 'spread':
        this.spreadTimer=480; // 8s
        this.textPopups.push(new TextPopup(pu.x,pu.y-15,'SPREAD','#f84',30));
        break;
    }
  }

  draw(c) {
    c.fillStyle='#0a0a1a'; c.fillRect(0,0,W,H);

    // Parallax stars with shake offset
    c.save();
    c.translate(shakeX, shakeY);
    drawStars(this.starDy);

    // Particles
    this.particles.forEach(p=>p.draw(c));
    // Powerups
    this.powerups.forEach(p=>p.draw(c));
    // Text popups
    this.textPopups.forEach(t=>t.draw(c));
    // Bullets
    this.bullets.forEach(b=>b.draw(c));
    // Asteroids
    this.asteroids.forEach(a=>a.draw(c));
    // Ship
    this.ship.draw(c);

    // Active powerup indicators
    let py=35;
    c.font='12px monospace'; c.textAlign='right';
    const pwr=[];
    if (this.rapidTimer>0) pwr.push({label:'RAPID',color:'#ff0',time:this.rapidTimer});
    if (this.shieldTimer>0) pwr.push({label:'SHIELD',color:'#4af',time:this.shieldTimer});
    if (this.spreadTimer>0) pwr.push({label:'SPREAD',color:'#f84',time:this.spreadTimer});
    pwr.forEach(p=>{
      c.fillStyle=p.color; c.globalAlpha=0.5+0.3*Math.sin(Date.now()/150);
      c.fillText(p.label+' '+Math.ceil(p.time/60)+'s', W-15, py);
      c.globalAlpha=1; py+=16;
    });
    c.textAlign='start';

    // Level
    c.fillStyle='rgba(255,255,255,0.15)'; c.font='12px monospace';
    c.fillText('LVL '+this.level, 15, H-15);
    if (this.combo>1) {
      c.fillStyle='#ff8'; c.font='14px monospace'; c.textAlign='center';
      c.fillText('x'+this.combo.toFixed(1), W/2, 40); c.textAlign='start';
    }
    c.restore();
  }
}

// ── UI ────────────────────────────────────────────────
function updateUI() {
  if (!game) return;
  scoreDisplay.textContent=game.score;
  livesDisplay.innerHTML='&#9829; '.repeat(Math.max(0,game.lives)).trim();
  // Show powerup symbols in lives area
  let suffix='';
  if (game.shieldTimer>0) suffix+=' &#9724;';
  if (game.rapidTimer>0) suffix+=' &#9889;';
  if (game.spreadTimer>0) suffix+=' &#9884;';
  if (suffix) livesDisplay.innerHTML+=suffix;
}

// ── Game Loop ─────────────────────────────────────────
function gameLoop() {
  requestAnimationFrame(gameLoop);
  try {
    if (!game) return;
    if (!game.dead) {
      game.update();
      game.draw(ctx);
      updateUI();
      gameOverDisplayed=false;
    } else {
      if (!gameOverDisplayed) {
        game.draw(ctx);
        const isNew=setHigh(game.score);
        overlay.classList.remove('hidden');
        overlay.innerHTML=`
          <h1>GAME OVER</h1>
          <div class="final-score">Score: ${game.score}</div>
          <div class="best-score">${isNew?'&#9733; NEW BEST! &#9733;':'Best: '+getHigh()}</div>
          <button id="restartBtn">&#9654; PLAY AGAIN</button>
          <div class="controls">Move: WASD / Arrows &bull; Shoot: Space / F</div>
        `;
        document.getElementById('restartBtn').onclick=startGame;
        gameOverDisplayed=true;
      }
    }
  } catch(e) { console.warn('Cosmic Dodge loop:', e); }
}

function startGame() {
  initAudio();
  game=new Game();
  overlay.classList.add('hidden');
  showHigh();
}

// ── Events ────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
startBtn.onclick=function(){initAudio(); startGame();};

function resize(){
  const maxW=window.innerWidth-20, maxH=window.innerHeight-20;
  const scale=Math.min(1, maxW/W, maxH/H);
  canvas.style.width=(W*scale)+'px'; canvas.style.height=(H*scale)+'px';
  const gc=document.getElementById('gameContainer');
  gc.style.transform='scale('+scale+')'; gc.style.transformOrigin='top left';
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}
window.addEventListener('resize',resize); resize();

// ── Init ──────────────────────────────────────────────
showHigh();
game=null;
ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
drawStars(0);
gameLoop();
</script>
