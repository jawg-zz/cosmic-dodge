<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border: 2px solid #334;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,100,255,0.15);
  }
  canvas {
    display: block;
    background: #0a0a1a;
    border-radius: 6px;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    user-select: none;
  }
  #ui span {
    color: #8af;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(100,170,255,0.5);
  }
  #score { color: #fff; font-size: 22px; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5,5,20,0.82);
    pointer-events: auto;
    border-radius: 6px;
    transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    color: #fff;
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(100,170,255,0.6);
  }
  #overlay .sub {
    color: #8af;
    font-size: 16px;
    margin-bottom: 6px;
  }
  #overlay .final-score {
    color: #ff8;
    font-size: 22px;
    margin-bottom: 25px;
  }
  #overlay .controls {
    color: #667;
    font-size: 13px;
    margin-top: 20px;
  }
  button {
    background: linear-gradient(135deg, #226, #448);
    color: #fff;
    border: 1px solid #66a;
    padding: 12px 40px;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    pointer-events: auto;
    margin-top: 10px;
  }
  button:hover { background: linear-gradient(135deg, #338, #66a); border-color: #88c; box-shadow: 0 0 20px rgba(100,170,255,0.3); }
  .lives { color: #f55 !important; text-shadow: 0 0 10px rgba(255,80,80,0.5); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <span id="scoreDisplay">0</span>
    <span id="livesDisplay" class="lives">&#9829; &#9829; &#9829;</span>
  </div>
  <div id="overlay">
    <h1>&#9733; COSMIC DODGE &#9733;</h1>
    <div class="sub">Navigate the asteroid field</div>
    <button id="startBtn">&#9654; PLAY</button>
    <div class="controls">Arrow Keys / WASD &mdash; Move &bull; Space &mdash; Shoot</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const startBtn = document.getElementById('startBtn');

const W = 600, H = 800;
canvas.width = W; canvas.height = H;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

// Game state
let game = null;
let keys = {};

// Stars background
const stars = Array.from({length: 150}, () => ({
  x: Math.random() * W, y: Math.random() * H,
  size: Math.random() * 2 + 0.5, speed: Math.random() * 0.5 + 0.1,
  brightness: Math.random()
}));

class Particle {
  constructor(x, y, color, vx, vy, life, size) {
    this.x = x; this.y = y; this.color = color;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.size = size || 3;
  }
  update() { this.x += this.vx; this.y += this.vy; this.life--; }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.size * alpha, this.size * alpha);
    ctx.globalAlpha = 1;
  }
  get dead() { return this.life <= 0; }
}

class Ship {
  constructor() {
    this.x = W / 2; this.y = H - 80;
    this.w = 28; this.h = 32;
    this.speed = 5;
    this.invincible = 0;
    this.tilt = 0;
  }
  update() {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
    if (keys['ArrowDown'] || keys['KeyS']) dy = 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.x += dx * this.speed;
    this.y += dy * this.speed;
    this.x = Math.max(this.w, Math.min(W - this.w, this.x));
    this.y = Math.max(this.h, Math.min(H - this.h, this.y));
    this.tilt += (dx * 0.15 - this.tilt) * 0.15;
    if (this.invincible > 0) this.invincible--;
  }
  draw(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);
    // Engine glow
    const grad = ctx.createRadialGradient(0, 18, 2, 0, 22, 18);
    grad.addColorStop(0, 'rgba(100,200,255,0.8)');
    grad.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 20, 18, 0, Math.PI * 2);
    ctx.fill();
    // Ship body
    ctx.fillStyle = '#6af';
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(-14, 14); ctx.lineTo(-6, 10);
    ctx.lineTo(-4, 16); ctx.lineTo(0, 20); ctx.lineTo(4, 16);
    ctx.lineTo(6, 10); ctx.lineTo(14, 14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8cf';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
  getBounds() {
    return { x: this.x - 8, y: this.y - 14, w: 16, h: 30 };
  }
}

class Bullet {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.speed = 10;
    this.w = 4; this.h = 12;
  }
  update() { this.y -= this.speed; }
  draw(ctx) {
    const grad = ctx.createLinearGradient(this.x, this.y - 6, this.x, this.y + 6);
    grad.addColorStop(0, 'rgba(255,255,200,0)');
    grad.addColorStop(0.3, '#ff8');
    grad.addColorStop(0.7, '#ff8');
    grad.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(this.x - 2, this.y - 6, 4, 12);
  }
  get dead() { return this.y < -10; }
  getBounds() {
    return { x: this.x - 2, y: this.y - 6, w: 4, h: 12 };
  }
}

class Asteroid {
  constructor() {
    const side = Math.floor(Math.random() * 4);
    this.radius = Math.random() * 20 + 12;
    switch(side) {
      case 0: this.x = Math.random() * W; this.y = -this.radius; break;
      case 1: this.x = W + this.radius; this.y = Math.random() * H * 0.6; break;
      case 2: this.x = Math.random() * W; this.y = H + this.radius; break;
      case 3: this.x = -this.radius; this.y = Math.random() * H * 0.6; break;
    }
    const angle = Math.atan2(H/2 - this.y, W/2 - this.x) + (Math.random() - 0.5) * 1.2;
    const speed = Math.random() * 1.5 + 0.8 + game.level * 0.15;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.04;
    this.vertices = [];
    const vertCount = Math.floor(Math.random() * 5) + 6;
    for (let i = 0; i < vertCount; i++) {
      const a = (i / vertCount) * Math.PI * 2;
      const r = this.radius * (0.7 + Math.random() * 0.3);
      this.vertices.push({ a, r });
    }
    this.color = Math.random() > 0.5 ? '#876' : '#765';
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.rotation += this.rotSpeed;
    const margin = this.radius + 50;
    if (this.x < -margin || this.x > W + margin || this.y < -margin || this.y > H + margin) {
      this.dead = true;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#a98';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    this.vertices.forEach((v, i) => {
      const x = Math.cos(v.a) * v.r;
      const y = Math.sin(v.a) * v.r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  getBounds() {
    return { x: this.x - this.radius, y: this.y - this.radius, w: this.radius * 2, h: this.radius * 2 };
  }
  getRadius() { return this.radius; }
}

function rectCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

class Game {
  constructor() {
    this.ship = new Ship();
    this.bullets = [];
    this.asteroids = [];
    this.particles = [];
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.dead = false;
    this.spawnTimer = 0;
    this.spawnInterval = 60;
    this.shootCooldown = 0;
    this.combo = 0;
  }
  update() {
    this.ship.update();
    this.shootCooldown--;

    // Shoot
    if ((keys['Space'] || keys['KeyF']) && this.shootCooldown <= 0) {
      this.bullets.push(new Bullet(this.ship.x, this.ship.y - 18));
      this.shootCooldown = 10;
    }

    // Bullets
    this.bullets.forEach(b => b.update());
    this.bullets = this.bullets.filter(b => !b.dead);

    // Spawn asteroids
    this.spawnTimer++;
    const interval = Math.max(15, this.spawnInterval - this.level * 2);
    if (this.spawnTimer >= interval && this.asteroids.length < 15 + this.level) {
      this.asteroids.push(new Asteroid());
      this.spawnTimer = 0;
    }

    // Asteroids
    this.asteroids.forEach(a => a.update());
    this.asteroids = this.asteroids.filter(a => !a.dead);

    // Particles
    this.particles.forEach(p => p.update());
    this.particles = this.particles.filter(p => !p.dead);

    // Bullet-asteroid collisions
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      for (let j = this.asteroids.length - 1; j >= 0; j--) {
        if (rectCollision(this.bullets[i].getBounds(), this.asteroids[j].getBounds())) {
          const ast = this.asteroids[j];
          const bx = ast.x, by = ast.y;
          // Explosion particles
          for (let k = 0; k < 20; k++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            const colors = ['#f84', '#fa4', '#ff8', '#f44', '#ff0'];
            this.particles.push(new Particle(bx, by, colors[Math.floor(Math.random()*colors.length)],
              Math.cos(angle)*speed, Math.sin(angle)*speed, Math.floor(Math.random()*30)+15, Math.random()*4+2));
          }
          this.bullets.splice(i, 1);
          this.asteroids.splice(j, 1);
          this.combo++;
          const bonus = Math.ceil(ast.getRadius() / 5) * (1 + this.combo * 0.1);
          this.score += Math.floor(bonus);
          break;
        }
      }
    }

    // Ship-asteroid collisions
    if (this.ship.invincible <= 0) {
      const sb = this.ship.getBounds();
      for (const a of this.asteroids) {
        if (rectCollision(sb, a.getBounds())) {
          this.lives--;
          this.combo = 0;
          this.ship.invincible = 60;
          // Ship hit particles
          for (let k = 0; k < 15; k++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 3 + 1;
            this.particles.push(new Particle(this.ship.x, this.ship.y, '#6af',
              Math.cos(angle)*speed, Math.sin(angle)*speed, 20, 3));
          }
          if (this.lives <= 0) this.dead = true;
          break;
        }
      }
    }

    // Level progression
    this.level = Math.floor(this.score / 20) + 1;
  }
  draw(ctx) {
    // Draw stars
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(s => {
      s.brightness += (Math.random() - 0.5) * 0.05;
      s.brightness = Math.max(0.3, Math.min(1, s.brightness));
      ctx.fillStyle = `rgba(255,255,255,${s.brightness * 0.7})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    // Particles
    this.particles.forEach(p => p.draw(ctx));
    // Bullets
    this.bullets.forEach(b => b.draw(ctx));
    // Asteroids
    this.asteroids.forEach(a => a.draw(ctx));
    // Ship
    this.ship.draw(ctx);

    // Draw level indicator
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = '12px monospace';
    ctx.fillText('LVL ' + this.level, 15, H - 15);
    if (this.combo > 1) {
      ctx.fillStyle = '#ff8';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('x' + this.combo.toFixed(1), W/2, 40);
      ctx.textAlign = 'start';
    }
  }
}

function updateUI() {
  if (!game) return;
  scoreDisplay.textContent = game.score;
  livesDisplay.innerHTML = '&#9829; '.repeat(Math.max(0, game.lives)).trim();
}

function gameLoop() {
  if (!game) return;
  if (!game.dead) {
    game.update();
    game.draw(ctx);
    updateUI();
  } else {
    game.draw(ctx);
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>GAME OVER</h1>
      <div class="final-score">Score: ${game.score} &bull; Level: ${game.level}</div>
      <button id="restartBtn">&#9654; PLAY AGAIN</button>
      <div class="controls">Arrow Keys / WASD &mdash; Move &bull; Space &mdash; Shoot</div>
    `;
    document.getElementById('restartBtn').onclick = startGame;
  }
  requestAnimationFrame(gameLoop);
}

function startGame() {
  game = new Game();
  overlay.classList.add('hidden');
}

// Event listeners
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
startBtn.onclick = startGame;

// Responsive resize
function resize() {
  const maxW = window.innerWidth - 20;
  const maxH = window.innerHeight - 20;
  const scale = Math.min(1, maxW / W, maxH / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  document.getElementById('gameContainer').style.transform = `scale(${scale})`;
  document.getElementById('gameContainer').style.transformOrigin = 'top left';
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

// Start game loop (idle until play)
game = null;
// Draw initial state
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);
stars.forEach(s => {
  ctx.fillStyle = `rgba(255,255,255,${s.brightness * 0.5})`;
  ctx.fillRect(s.x, s.y, s.size, s.size);
});
gameLoop();
</script>
</body>
</html>
